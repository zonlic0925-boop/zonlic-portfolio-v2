    <!--
      DIRECTION CONTRACT - Sheet 01, inspection drawing. Seed key zonlic-print-2026.
      THESIS: the page is a ballooned inspection drawing sheet, so every claim carries an index that
      points at the record it came from. It refuses the category default of a dark hero with a giant
      name floating over a portrait.
      OWN-WORLD: cool paper ground, blue-black ink, one blueprint-blue accent, square corners and
      hairline rules, Barlow technical lettering with Azeret Mono for measurements; the balloon
      circle is the only round geometry. Depth comes from paper tints, never from shadow.
      STORY: the visitor understands that one person carries a thread from laboratory bench to
      certification body to shipped installer, believes it because each claim is indexed to a figure
      or a revision row, and writes.
      FIRST VIEWPORT: bordered sheet with a zone rail; the name drawn as the part at display scale
      on the left; the portrait framed as DETAIL A on the right with a leader line back to the part;
      the title block spanning the bottom, holding identity fields and the single contact action.
      FORM: engineering drawing and FAI ballooned sheet, position 1 of the ordered list.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the
      verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
